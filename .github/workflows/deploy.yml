name: Deploy

# Runs after CI passes on a push to main. Deploys the Fly app, then the agent to the Sprite.
# Each job skips with a notice when its token secret is missing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  app:
    name: Fly app last-orders
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for FLY_API_TOKEN
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::Repository secret FLY_API_TOKEN is not set, so the Fly app was not deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'

      - name: flyctl deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --ha=false --config fly.toml --app last-orders

  agent:
    name: Sprite agent last-orders-gm
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
    steps:
      - name: Check for SPRITES_TOKEN
        id: token
        run: |
          if [ -z "$SPRITES_TOKEN" ]; then
            echo "::notice title=Agent deploy skipped::Repository secret SPRITES_TOKEN is not set, so the agent was not deployed to the Sprite."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Bundle and upload the agent
        if: steps.token.outputs.present == 'true'
        # Untested against the live Sprites API; see infra/sprite/deploy-agent.sh.
        # Repository variables override the agent's model settings without a code change.
        env:
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-sonnet-5-5' }}
          AGENT_MODEL_ADAPTER: ${{ vars.AGENT_MODEL_ADAPTER || 'anthropic' }}
        run: bash infra/sprite/deploy-agent.sh
